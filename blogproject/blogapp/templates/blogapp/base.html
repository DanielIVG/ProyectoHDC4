<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  {% load static %}
  <link rel="icon" href="{% static 'images/favicon.ico' %}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVerse</title>
  <script src="https://cdn.tailwindcss.com"></script>auth_permission
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#271E70',
              dark: '#1A1459',
              light: '#3A2D8C'
            },
            gamer: '#0f172a',
            neon: '#00ffe7',
            warning: '#ff0059'
          },
          fontFamily: {
            gamer: ['Orbitron', 'sans-serif']
          }
        }
      },
      plugins: []
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    input, textarea, select {
      background-color: white;
      color: black;
    }
    html {
      background-color: white;
      transition: background-color 0.5s ease-in-out;
    }
    .dark html {
      background-color: black;
    }
    html, body {
      height: 100%;
      scroll-behavior: smooth;
      transition: background-color 0.5s ease-in-out;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.6s ease-out;
      will-change: opacity, transform;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
      transition: box-shadow 0.3s ease;
    }
    .nav-glow {
      box-shadow: 0 4px 15px rgba(39, 30, 112, 0.7);
    }
    .neon-background {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: neonBackground 20s ease infinite;
    }
    @keyframes neonBackground {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .neon-glow {
      text-shadow: 0 0 2px #4de0d4, 0 0 5px #4de0d4;
    }
  </style>
</head>
<body id="body" class="min-h-screen flex flex-col text-white font-gamer neon-glow">
  <!-- Navbar con color #271E70 -->
  <nav class="bg-primary dark:bg-gradient-to-r dark:from-primary-dark dark:to-primary shadow-lg py-3 px-6 transition-colors duration-500 nav-glow">
    <div class="max-w-7xl mx-auto flex items-center px-1 w-full">
      <a href="{% url 'blogapp:blog_list' %}" class="flex items-center gap-2 text-white text-3xl font-extrabold tracking-widest hover:text-neon transition-all duration-300">
        <img src="{% static 'images/favicon.ico' %}" alt="Logo" class="h-12 w-12">
        GameVerse
      </a>

      <div class="flex ml-auto items-center space-x-4">
        <button onclick="toggleDarkMode()" class="flex items-center gap-2 px-4 py-2 rounded-full bg-primary-light/20 dark:bg-primary-dark/50 text-white hover:bg-primary-light/30 transition-all duration-300 shadow-md">
          <span id="theme-icon" class="transition-transform duration-500 transform">🌞</span>
          <span id="theme-label" class="transition-opacity duration-500 ease-in-out">Modo Claro</span>
        </button>

        {% if not request.path == '/login/' and not request.path == '/register/' %}
          {% if not user.is_authenticated %}
            <a href="{% url 'blogapp:login' %}" class="bg-white text-primary px-4 py-2 rounded-lg hover:bg-primary-light hover:text-white transition-all duration-300 font-medium">Login</a>
            <a href="{% url 'blogapp:register' %}" class="bg-neon text-black px-4 py-2 rounded-lg hover:bg-primary-light hover:text-white transition-all duration-300 font-medium">Register</a>
          {% else %}
            <a href="{% url 'blogapp:add_blog' %}" class="bg-neon text-black px-4 py-2 rounded-lg hover:bg-primary-light hover:text-white transition-all duration-300 font-medium">Nuevo Blog</a>
            <a href="{% url 'blogapp:logout' %}" class="bg-warning px-4 py-2 rounded-lg hover:bg-[#ff1a75] transition-all duration-300 text-white">Logout</a>
          {% endif %}
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow w-full neon-background transition-all duration-700 ease-in-out">
    <div class="max-w-6xl mx-auto px-6 py-8">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 bg-gray-800 text-gray-400">
    <p class="text-sm">🎮</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const prefersDark = localStorage.getItem('theme') === 'dark';
      const body = document.getElementById('body');
      const icon = document.getElementById('theme-icon');
      if (prefersDark) {
        body.classList.add('dark');
        if (icon) icon.textContent = '🌙';
        const label = document.getElementById('theme-label');
        if (label) label.textContent = 'Modo Oscuro';
      } else {
        if (icon) icon.textContent = '🌞';
        const label = document.getElementById('theme-label'); 
        if (label) label.textContent = 'Modo Claro';
      }
    });

    function toggleDarkMode() {
      const body = document.getElementById('body');
      const icon = document.getElementById('theme-icon');
      const isDark = body.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      if (icon) {
        icon.classList.add('rotate-180');
        setTimeout(() => {
          icon.textContent = isDark ? '🌙' : '🌞';
          const label = document.getElementById('theme-label');
          if (label) label.style.opacity = 0;
          setTimeout(() => {
            label.textContent = isDark ? 'Modo Oscuro' : 'Modo Claro';
            label.style.opacity = 1;
          }, 250);
          icon.classList.remove('rotate-180');
        }, 250);
      }
    }
  </script>
</body>
</html>
