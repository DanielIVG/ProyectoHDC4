{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header light-mode-link text-2xl mb-3">
                    <h3>Editar Perfil</h3>
                </div>
                <div class="card-body light-mode-link">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary hover:text-blue-600">Guardar Cambios</button>
                        <a href="{% url 'blogapp:dashboard' %}" class="btn btn-secondary hover:text-red-600">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
